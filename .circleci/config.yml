version: 2.1

executors:
  ruby-executor:
    docker:
      - image: cimg/ruby:3.3.3 # 開発PCと同じ
      - image: cimg/postgres:14.1
        environment:
          POSTGRES_USER: postgres #任意の名前
          POSTGRES_PASSWORD: postgres # 任意のpassword
          POSTGRES_DB: myportfolio_test # database.ymlと同じ
    working_directory: ~/repo

jobs:
  rspec:
    executor: ruby-executor
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/myportfolio_test # 上のenvironment内容で決まる
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: bundle check || bundle install --jobs=8
      - run:
          name: Set up Node & Yarn
          command: |
            curl -sL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            npm install --global yarn
      - run:
          name: Install JavaScript packages
          command: yarn install
      - run:（）
          name: Precompile Webpacker
          command: bundle exec rails webpacker:compile

      - run:
          name: Create test database # テスト用DBを初期状態にする
          command: bin/rails db:create db:schema:load

      - run:
          name: Run RSpec
          command: bundle exec rspec

workflows:
  version: 2
  run-tests:
    jobs:
      - rspec
