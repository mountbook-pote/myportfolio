version: 2.1

jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.3 
    steps:
      - checkout
      - run:
          name: Install Bundler
          command: gem install bundler -v 2.6.8
      - run:
          name: Install dependencies
          command: bundle _2.6.8_ install
      - run:
          name: Run tests
          command: bundle exec rake test || echo "No tests found"
