version: 2.1

orbs:
  heroku: circleci/heroku@2.0

executors:
  ruby-executor:
    docker:
      - image: cimg/ruby:3.3.3
    working_directory: ~/repo

jobs:
  rspec:
    resource_class: medium
    docker:
      - image: cimg/ruby:3.3.3  # Rubyメイン
      - image: cimg/postgres:14.1  # PostgreSQLサービス
        environment:
          POSTGRES_USER: postgres # コンテナ起動時の環境変数(任意)
          POSTGRES_PASSWORD: postgres # コンテナ起動時の環境変数(任意)
          POSTGRES_DB: myportfolio_test
    working_directory: ~/repo
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/myportfolio_test #environmentの内容から組み立て
    steps:
      - checkout
      - run:
          name: bundle install
          command: bundle check || bundle install --jobs=8 --clean
      - run: # POSTGRES_DBを初期状態にする
          name: Setup test database
          command: bin/rails db:create db:schema:load
      - run:
          name: run rspec
          command: bundle exec rspec

  rubocop:
    resource_class: small
    executor: ruby-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gemfiles-{{ .Branch }}-{{ checksum "Gemfile.lock" }}
            - gemfiles-{{ .Branch }}-
            - gemfiles-main-
      - run:
          name: bundle install
          command: bundle check || bundle install --jobs=8 --clean
      - run:
          name: run rubocop
          command: bundle exec rubocop --parallel
      - save_cache:
          key: gemfiles-{{ .Branch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

  heroku_deploy:
    resource_class: small
    executor: heroku/default
    steps:
      - checkout
      - heroku/install
      - run:
          name: deploy
          command: git push https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP_NAME.git HEAD:main
      - run:
          name: run db migrate on heroku
          command: heroku run bin/rails db:migrate -a $HEROKU_APP_NAME

workflows:
  version: 2.1
  build:
    jobs:
      - rspec
      - rubocop
      - heroku_deploy:
          requires:
            - rspec
            - rubocop
