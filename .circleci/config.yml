version: 2.1

executors:
  ruby-executor:
    docker:
      - image: cimg/ruby:3.3.3
      - image: cimg/postgres:14.1
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myportfolio_test
    working_directory: ~/repo

jobs:
  rspec:
    executor: ruby-executor
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/myportfolio_test
    steps:
      - checkout

      - run:
          name: Install Bundler
          command: gem install bundler -v 2.6.8

      - run:
          name: Bundle install
          command: bundle install --jobs=4

      - run:
          name: Create test database
          command: bin/rails db:create db:schema:load
          
      - run:
          name: Run RSpec
          command: bundle exec rspec

workflows:
  version: 2
  run-tests:
    jobs:
      - rspec
